rules:
  - id: detect-openai
    languages:
      - csharp
    severity: INFO
    message: "Detected usage of OpenAI C# SDK - including client initialization or API operations"
    pattern-either:
      # Using statements
      - pattern: using OpenAI;
      - pattern: using OpenAI.Chat;
      - pattern: using Azure.AI.OpenAI;
      # Client instantiation
      - pattern: new OpenAIClient(...)
      - pattern: new AzureOpenAIClient(...)
      - pattern: new ChatClient(...)
    metadata:
      references:
        - https://github.com/openai/openai-dotnet
        - https://platform.openai.com/docs/api-reference
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: security
      subcategory:
        - audit
      technology:
        - openai
        - genai
        - llm
        - csharp
        - dotnet
      cwe:
        - "CWE-1390: Weak Authentication"
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
