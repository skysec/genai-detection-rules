rules:
  - id: detect-anthropic
    languages:
      - python
    severity: INFO
    message: "Detected usage of Anthropic Claude API - including client initialization, message operations, or streaming"
    patterns:
      - pattern-either:
          # Import patterns
          - pattern: import anthropic
          - pattern: from anthropic import $ANYTHING
          # Client instantiation patterns
          - pattern: Anthropic(...)
          - pattern: anthropic.Anthropic(...)
          - pattern: AsyncAnthropic(...)
          - pattern: anthropic.AsyncAnthropic(...)
          - pattern: AnthropicBedrock(...)
          - pattern: AnthropicVertex(...)
          # API operations - messages
          - pattern: $CLIENT.messages.create(...)
          - pattern: $CLIENT.messages.stream(...)
          # API operations - completions (legacy)
          - pattern: $CLIENT.completions.create(...)
          # Count tokens
          - pattern: $CLIENT.count_tokens(...)
    metadata:
      references:
        - https://docs.anthropic.com/en/api/getting-started
        - https://github.com/anthropics/anthropic-sdk-python
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: security
      subcategory:
        - audit
      technology:
        - anthropic
        - claude
        - genai
        - llm
      cwe:
        - "CWE-1390: Weak Authentication"
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
