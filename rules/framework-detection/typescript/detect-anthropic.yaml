rules:
  - id: detect-anthropic
    languages:
      - js
      - ts
      - typescript
      - javascript
    severity: INFO
    message: "Detected usage of Anthropic Claude API - including client initialization, message operations, or streaming"
    patterns:
      - pattern-either:
          # Import patterns
          - pattern: import "@anthropic-ai/sdk"
          - pattern: import $ANYTHING from "@anthropic-ai/sdk"
          - pattern: import { ..., $ANYTHING, ... } from "@anthropic-ai/sdk"
          - pattern: |
              const $ANYTHING = require("@anthropic-ai/sdk")
          # Client instantiation patterns
          - pattern: new Anthropic(...)
          - pattern: new $PKG.Anthropic(...)
          - pattern: new AnthropicBedrock(...)
          - pattern: new AnthropicVertex(...)
          # Message operations
          - pattern: $CLIENT.messages.create(...)
          - pattern: $CLIENT.messages.stream(...)
          # Completions (legacy)
          - pattern: $CLIENT.completions.create(...)
          # Count tokens
          - pattern: $CLIENT.countTokens(...)
    metadata:
      references:
        - https://docs.anthropic.com/en/api/getting-started
        - https://github.com/anthropics/anthropic-sdk-typescript
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: security
      subcategory:
        - audit
      technology:
        - anthropic
        - claude
        - genai
        - llm
      cwe:
        - "CWE-1390: Weak Authentication"
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
