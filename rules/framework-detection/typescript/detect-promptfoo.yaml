rules:
  - id: detect-promptfoo
    languages:
      - js
      - ts
      - typescript
      - javascript
    severity: INFO
    message: "Detected usage of Promptfoo - AI evaluation and testing framework"
    patterns:
      - pattern-either:
          # Import patterns
          - pattern: import "promptfoo"
          - pattern: import $ANYTHING from "promptfoo"
          - pattern: import { ..., $ANYTHING, ... } from "promptfoo"
          - pattern: |
              const $ANYTHING = require("promptfoo")
          # Core evaluation functions
          - pattern: promptfoo.evaluate(...)
          - pattern: $PROMPTFOO.evaluate(...)
          # Assertion functions
          - pattern: promptfoo.assert(...)
          - pattern: $PROMPTFOO.assert(...)
          # Provider functions
          - pattern: promptfoo.providers.$PROVIDER(...)
          # Test suite
          - pattern: promptfoo.testSuite(...)
    metadata:
      references:
        - https://www.promptfoo.dev/docs/intro
        - https://github.com/promptfoo/promptfoo
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: security
      subcategory:
        - audit
      technology:
        - promptfoo
        - genai
        - llm
        - testing
      cwe:
        - "CWE-1390: Weak Authentication"
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
