rules:
  - id: detect-gemini
    languages:
      - kotlin
    severity: INFO
    message: "Detected usage of Google Gemini Kotlin SDK - including model initialization or content generation"
    patterns:
      - pattern-either:
          # Import patterns
          - pattern: import com.google.ai.client.generativeai.GenerativeModel
          - pattern: import com.google.ai.client.generativeai.*
          # Model initialization
          - pattern: GenerativeModel(...)
          # Content generation
          - pattern: $MODEL.generateContent(...)
          - pattern: $MODEL.generateContentStream(...)
          # Chat
          - pattern: $MODEL.startChat(...)
    metadata:
      references:
        - https://github.com/google/generative-ai-android
        - https://ai.google.dev/tutorials/android_quickstart
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: security
      subcategory:
        - audit
      technology:
        - google-gemini
        - genai
        - llm
        - kotlin
      cwe:
        - "CWE-1390: Weak Authentication"
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
