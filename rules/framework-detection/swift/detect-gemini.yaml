rules:
  - id: detect-gemini
    languages:
      - swift
    severity: INFO
    message: "Detected usage of Google Gemini Swift SDK - including model initialization or content generation"
    patterns:
      - pattern-either:
          # Import patterns
          - pattern: import GoogleGenerativeAI
          # Model initialization
          - pattern: GenerativeModel(...)
          - pattern: GoogleGenerativeAI.GenerativeModel(...)
          # Content generation
          - pattern: $MODEL.generateContent(...)
          - pattern: $MODEL.generateContentStream(...)
          # Chat
          - pattern: $MODEL.startChat(...)
    metadata:
      references:
        - https://github.com/google/generative-ai-swift
        - https://ai.google.dev/tutorials/swift_quickstart
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: security
      subcategory:
        - audit
      technology:
        - google-gemini
        - genai
        - llm
        - swift
      cwe:
        - "CWE-1390: Weak Authentication"
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
