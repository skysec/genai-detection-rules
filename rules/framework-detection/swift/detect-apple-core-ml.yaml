rules:
  - id: detect-apple-core-ml
    languages:
      - swift
    severity: INFO
    message: "Detected usage of Apple Core ML - including model loading, configuration, or inference"
    patterns:
      - pattern-either:
          # Import patterns
          - pattern: import CoreML
          - pattern: import Vision
          # Model configuration
          - pattern: MLModelConfiguration(...)
          # Vision Core ML
          - pattern: VNCoreMLModel(...)
          - pattern: VNCoreMLModel.model(...)
          # Core ML model
          - pattern: MLModel.load(...)
          - pattern: MLModel.compileModel(...)
          # Prediction
          - pattern: $MODEL.prediction(...)
          - pattern: $MODEL.predictions(...)
          # Vision requests
          - pattern: VNCoreMLRequest(...)
          - pattern: VNImageRequestHandler(...)
    metadata:
      references:
        - https://developer.apple.com/documentation/coreml
        - https://developer.apple.com/documentation/vision
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: security
      subcategory:
        - audit
      technology:
        - apple-coreml
        - ml
        - ai
        - swift
      cwe:
        - "CWE-1390: Weak Authentication"
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
