rules:
  - id: detect-generic-ai-gem
    languages:
      - generic
    severity: INFO
    message: "Detected potential Google Gemini usage in configuration or documentation files"
    patterns:
      - pattern-either:
          # API endpoints
          - pattern: generativelanguage.googleapis.com
          - pattern: ai.google.dev
          # Model names
          - pattern: gemini-pro
          - pattern: gemini-1.5
          - pattern: gemini-flash
          - pattern: gemini-ultra
          # Package/module references
          - pattern: |
              "@google/generative-ai"
          - pattern: |
              "google.generativeai"
          - pattern: google.ai.generativelanguage
          - pattern: github.com/google/generative-ai
          # Environment variables
          - pattern: GEMINI_API_KEY
          - pattern: GOOGLE_AI_KEY
    metadata:
      references:
        - https://ai.google.dev/api
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: security
      subcategory:
        - audit
      technology:
        - google-gemini
        - genai
        - llm
      cwe:
        - "CWE-1390: Weak Authentication"
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
